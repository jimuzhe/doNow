name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Clean iOS Project
        run: |
          cd ios
          rm -rf Runner.xcodeproj
          rm -rf Runner.xcworkspace
          rm -rf Pods
          rm -f Podfile.lock
          cd ..
          flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          cd ..

      - name: Generate App Icons
        run: |
          sed -i '' 's/ios: false/ios: true/' pubspec.yaml || true
          dart run flutter_launcher_icons || true

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS App with Flutter
        run: |
          # Build the iOS app using Flutter (this handles everything including xcodebuild)
          flutter build ios --release --no-codesign 2>&1 | tee flutter_build.log
          
          # List the build output
          echo "📂 Flutter build output:"
          ls -la build/ios/iphoneos/ || true
          
          # Check if Runner.app exists and show contents
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "📱 Runner.app contents:"
            ls -la build/ios/iphoneos/Runner.app/
          fi

      - name: Verify and Prepare App Bundle
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          # Check if the app bundle exists
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ Runner.app not found in build/ios/iphoneos/"
            echo "🔍 Searching for Runner.app..."
            find . -name "Runner.app" -type d 2>/dev/null
            
            # Try to find it elsewhere
            FOUND_APP=$(find . -name "Runner.app" -type d 2>/dev/null | grep -v Pods | head -1)
            if [ -n "$FOUND_APP" ]; then
              echo "✅ Found at: $FOUND_APP"
              mkdir -p build/ios/iphoneos
              cp -r "$FOUND_APP" "$APP_PATH"
            else
              echo "📋 Flutter build log (last 50 lines):"
              tail -50 flutter_build.log
              exit 1
            fi
          fi
          
          echo "📂 App bundle contents:"
          ls -la "$APP_PATH"
          
          # Check for Info.plist
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Info.plist not found in app bundle"
            echo "📋 This usually means the build failed. Checking for errors..."
            grep -i "error:" flutter_build.log || echo "No obvious errors in flutter build log"
            exit 1
          fi
          
          # Check for executable
          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "❌ Runner executable not found in app bundle"
            exit 1
          fi
          
          echo "✅ App bundle is valid"

      - name: Sign App for TrollStore
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          echo "📱 Signing app bundle..."
          
          # Sign all frameworks first
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "✍️ Signing frameworks..."
            find "$APP_PATH/Frameworks" -name "*.framework" -type d | while read framework; do
              codesign -f -s - "$framework" 2>/dev/null || true
            done
            find "$APP_PATH/Frameworks" -name "*.dylib" -type f | while read dylib; do
              codesign -f -s - "$dylib" 2>/dev/null || true
            done
          fi
          
          # Sign Widget Extension
          WIDGET_PATH="$APP_PATH/PlugIns/DoNowWidget.appex"
          if [ -d "$WIDGET_PATH" ]; then
            echo "✍️ Signing DoNowWidget extension..."
            codesign -f -s - --entitlements ios/DoNowWidget/DoNowWidget.entitlements "$WIDGET_PATH"
          fi
          
          # Sign Main App
          echo "✍️ Signing Runner.app..."
          codesign -f -s - --entitlements ios/Runner/Runner.entitlements "$APP_PATH"
          
          # Verify signing
          echo "✅ Verifying signature..."
          codesign -vv "$APP_PATH" || echo "⚠️ Signature verification had warnings (normal for ad-hoc)"
          
          echo "📋 Entitlements:"
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || echo "Could not display entitlements"

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r DoNow_TrollStore.ipa Payload
          echo "📦 IPA created:"
          ls -la DoNow_TrollStore.ipa
          
          # Calculate checksum
          shasum -a 256 DoNow_TrollStore.ipa
          cd ../../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DoNow_TrollStore_IPA
          path: build/ios/iphoneos/DoNow_TrollStore.ipa
          
      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: flutter_build.log
