name: Build iOS IPA for TrollStore

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    name: Build iOS IPA
    runs-on: macos-14
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Clean iOS Project
        run: |
          cd ios
          rm -rf Runner.xcodeproj
          rm -rf Runner.xcworkspace
          rm -rf Pods
          rm -f Podfile.lock
          cd ..
          flutter clean

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate Xcode Project
        run: |
          cd ios
          xcodegen generate
          cd ..

      - name: Generate App Icons
        run: |
          sed -i '' 's/ios: false/ios: true/' pubspec.yaml || true
          dart run flutter_launcher_icons || true

      - name: Pod Install
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build Flutter Assets
        run: |
          # Set FLUTTER_ROOT environment variable
          export FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "FLUTTER_ROOT: $FLUTTER_ROOT"
          
          # Only build Flutter assets, don't try to build the full iOS app
          flutter build ios --release --no-codesign 2>&1 || true

      - name: Build with Xcodebuild (Ad-hoc Signing)
        run: |
          export FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          echo "FLUTTER_ROOT: $FLUTTER_ROOT"
          
          cd ios
          
          # Build using xcodebuild with ad-hoc signing
          # Using 'build' instead of 'archive' for better control
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            BUILD_DIR=build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            GENERATE_INFOPLIST_FILE=NO \
            FLUTTER_ROOT="$FLUTTER_ROOT" \
            clean build 2>&1 | tee xcodebuild.log || true
          
          # Debug: List what was built
          echo "📂 Contents of build directory:"
          find build -name "*.app" -type d 2>/dev/null || true
          
          cd ..

      - name: Locate and Prepare App Bundle
        run: |
          echo "🔍 Searching for built app..."
          
          # Check xcodebuild build output first (new path)
          if [ -d "ios/build/Release-iphoneos/Runner.app" ]; then
            echo "✅ Found app in iOS build/Release-iphoneos directory"
            APP_SOURCE="ios/build/Release-iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            echo "✅ Found app in Flutter build directory"
            APP_SOURCE="build/ios/Release-iphoneos/Runner.app"
          elif [ -d "ios/build/Runner.xcarchive/Products/Applications/Runner.app" ]; then
            echo "✅ Found app in archive"
            APP_SOURCE="ios/build/Runner.xcarchive/Products/Applications/Runner.app"
          else
            echo "🔍 Searching all build directories..."
            find . -name "Runner.app" -type d 2>/dev/null
            
            # Try to find any Runner.app (excluding Pods)
            APP_SOURCE=$(find . -name "Runner.app" -type d 2>/dev/null | grep -v "Pods" | head -1)
            
            if [ -z "$APP_SOURCE" ]; then
              echo "❌ Could not find Runner.app"
              echo "📋 Build log (last 100 lines):"
              tail -100 ios/xcodebuild.log || true
              exit 1
            fi
            echo "✅ Found app at: $APP_SOURCE"
          fi
          
          # Debug: Show app bundle contents before copy
          echo "📂 Source app bundle contents:"
          ls -la "$APP_SOURCE"
          
          # Verify Info.plist exists in source
          if [ ! -f "$APP_SOURCE/Info.plist" ]; then
            echo "⚠️ Warning: Info.plist not found in source app bundle"
            echo "📋 Checking if build completed properly..."
            grep -i "error:" ios/xcodebuild.log || echo "No obvious errors found"
          fi
          
          # Prepare output directory
          mkdir -p build/ios/iphoneos
          cp -r "$APP_SOURCE" build/ios/iphoneos/Runner.app
          
          echo "✅ App copied to build/ios/iphoneos/Runner.app"
          echo "📂 Final app bundle contents:"
          ls -la build/ios/iphoneos/Runner.app

      - name: Sign App for TrollStore
        run: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          
          # Check if app bundle is valid
          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "❌ Invalid app bundle - Info.plist not found"
            ls -la "$APP_PATH" || true
            exit 1
          fi
          
          echo "📱 App bundle contents:"
          ls -la "$APP_PATH"
          
          # Sign all frameworks first
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "✍️ Signing frameworks..."
            find "$APP_PATH/Frameworks" -name "*.framework" -o -name "*.dylib" | while read framework; do
              codesign -f -s - "$framework" 2>/dev/null || true
            done
          fi
          
          # Sign Widget Extension
          WIDGET_PATH="$APP_PATH/PlugIns/DoNowWidget.appex"
          if [ -d "$WIDGET_PATH" ]; then
            echo "✍️ Signing DoNowWidget extension..."
            codesign -f -s - --entitlements ios/DoNowWidget/DoNowWidget.entitlements "$WIDGET_PATH"
          fi
          
          # Sign Main App
          echo "✍️ Signing Runner.app..."
          codesign -f -s - --entitlements ios/Runner/Runner.entitlements "$APP_PATH"
          
          # Verify signing
          echo "✅ Verifying signature..."
          codesign -vv "$APP_PATH" || echo "⚠️ Signature verification had warnings (normal for ad-hoc)"
          
          echo "📋 Entitlements:"
          codesign -d --entitlements :- "$APP_PATH" 2>/dev/null || echo "Could not display entitlements"

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r DoNow_TrollStore.ipa Payload
          echo "📦 IPA created:"
          ls -la DoNow_TrollStore.ipa
          
          # Calculate checksum
          shasum -a 256 DoNow_TrollStore.ipa
          cd ../../..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DoNow_TrollStore_IPA
          path: build/ios/iphoneos/DoNow_TrollStore.ipa
          
      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/xcodebuild.log
